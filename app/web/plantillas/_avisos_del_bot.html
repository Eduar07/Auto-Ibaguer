{% import "_burbujas_del_bot.html" as burbujas %}
{#- Cada 3 segundos pregunta si la fila le dejó un aviso nuevo a este celular. -#}
<div id="avisos-del-bot" hidden hx-get="/probar-bot/avisos" hx-trigger="every 3s" hx-swap="outerHTML"
     hx-vals='{{ {"telefono": telefono, "desde": desde}|tojson }}'></div>
{% if avisos %}
<div hx-swap-oob="beforeend:#charla">
  {% for aviso in avisos %}{{ burbujas.del_bot(aviso, telefono, "Aviso de la fila") }}{% endfor %}
</div>
{% endif %}

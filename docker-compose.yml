# Base de datos PostgreSQL para desarrollo.
# Se levanta con: docker compose up -d
# Usa el puerto 5433 de tu computador para no chocar con otro PostgreSQL que tengas instalado.
services:
  postgres:
    image: postgres:17-alpine
    container_name: auto-ibaguer-postgres
    environment:
      POSTGRES_USER: auto
      POSTGRES_PASSWORD: auto
      POSTGRES_DB: auto_ibaguer
      TZ: America/Bogota
    ports:
      - "5433:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto -d auto_ibaguer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_postgres:

[project]
name = "auto-ibaguer"
version = "0.1.0"
description = "Turnos por WhatsApp y dashboard para el lavadero Auto Ibaguer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi[standard]>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
]

[project.scripts]
auto-ibaguer = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las genera Alembic y tienen líneas largas de SQL.
"migraciones/versions/*" = ["E501"]
